[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-voice-desktop"
version = "0.1.0"
description = "A cross-platform voice-controlled assistant built on RealtimeSTT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["voice", "assistant", "voice-controlled", "speech-recognition", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "RealtimeSTT[faster-whisper]",
    "openrouter",
    "python-dotenv",
    "pyttsx3"
]

[project.urls]
Homepage = "https://github.com/yourusername/Jarvis"
Documentation = "https://github.com/yourusername/Jarvis#readme"
Repository = "https://github.com/yourusername/Jarvis.git"
Issues = "https://github.com/yourusername/Jarvis/issues"

[project.scripts]
jarvis = "jarvis.jarvis:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
